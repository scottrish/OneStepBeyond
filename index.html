<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>OneStepBeyond</title>
    <!--
      PWA phase 1 (installable, standalone; no service worker) —
      docs/decisions/20260924-pwa-in-two-phases.md and
      docs/features/mobile-app-shell-and-touch-ergonomics-v0.1.md §7.
      theme-color is the resolved --background token of the scheme being
      shown (src/domain/appearance.ts THEME_COLORS); the manifest (one
      value only) uses the light one.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#fbf9f3" />
    <!--
      Light or dark before the first paint, so there's never a flash of the
      wrong colours (docs/features/appearance-light-dark-v0.1.md). Reads the
      same storage key as src/services/appearanceService.ts; the app takes
      over from src/lib/appearanceStore.ts once it has loaded. Keep in step
      with both (a test checks the key and colours).
    -->
    <script>
      (function () {
        var choice = "system";
        try {
          var saved = window.localStorage.getItem("osb-appearance");
          if (saved === "light" || saved === "dark" || saved === "system") choice = saved;
        } catch (e) {}
        var dark =
          choice === "dark" ||
          (choice === "system" &&
            !!window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        root.setAttribute("data-theme", dark ? "dark" : "light");
        root.style.colorScheme = dark ? "dark" : "light";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#020618" : "#fbf9f3");
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="OneStep" />
    <!-- Fonts match ../OneStepBeyondPrototype/src/routes/__root.tsx exactly. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
